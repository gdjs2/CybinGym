http_port 3128

#
# ============================================================
# MODEL APIs
# ============================================================
#

# OpenAI
acl allowed_domains dstdomain api.openai.com

# Anthropic
acl allowed_domains dstdomain api.anthropic.com

# Google Gemini
acl allowed_domains dstdomain generativelanguage.googleapis.com

# Mistral
acl allowed_domains dstdomain api.mistral.ai

# xAI
acl allowed_domains dstdomain api.x.ai

# Kimi / Moonshot AI
acl allowed_domains dstdomain api.moonshot.ai
acl allowed_domains dstdomain api.moonshot.cn
acl allowed_domains dstdomain api.kimi.com


#
# ============================================================
# PYTHON / PIP
# ============================================================
#

acl allowed_domains dstdomain pypi.org
acl allowed_domains dstdomain files.pythonhosted.org


#
# ============================================================
# UBUNTU APT
# ============================================================
#

acl allowed_domains dstdomain archive.ubuntu.com
acl allowed_domains dstdomain security.ubuntu.com
acl allowed_domains dstdomain ports.ubuntu.com


#
# ============================================================
# DEBIAN APT
# ============================================================
#

acl allowed_domains dstdomain deb.debian.org
acl allowed_domains dstdomain security.debian.org


#
# ============================================================
# OPTIONAL PACKAGE REPOSITORIES
# ============================================================
#

# Uncomment if you install PyTorch from its own index.
# acl allowed_domains dstdomain download.pytorch.org

# Uncomment if your Ubuntu image uses this repository.
# acl allowed_domains dstdomain azure.archive.ubuntu.com


#
# ============================================================
# PORT RESTRICTIONS
# ============================================================
#

acl SSL_ports port 443

acl Safe_ports port 80
acl Safe_ports port 443

acl CONNECT method CONNECT


#
# Don't allow Squid management interface access.
#

http_access deny manager


#
# Reject weird destination ports.
#

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports


#
# THE ACTUAL ALLOWLIST
#

http_access allow allowed_domains


#
# Everything not explicitly listed above is blocked.
#

http_access deny all


#
# Logging
#

access_log stdio:/var/log/squid/access.log